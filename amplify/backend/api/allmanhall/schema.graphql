type FileMetadata @model @auth(rules: [
  { allow: owner },
  { allow: private, operations: [read] }
]) {
  id: ID!
  fileName: String!
  fileSize: Int
  s3Key: String!
  status: FileStatus!
  approvalStatus: ApprovalStatus!
  uploadDate: AWSDateTime!
  processedDate: AWSDateTime
  approvedDate: AWSDateTime
  rejectedDate: AWSDateTime
  rejectionReason: String
  outputFiles: [OutputFile]
  downloadUrls: [DownloadUrl]
  createdBy: String!
  boxUploaded: Boolean
  boxUploadedAt: AWSDateTime
}

type OutputFile {
  type: String!
  s3Key: String!
  fileName: String!
  generatedDate: AWSDateTime
}

type DownloadUrl {
  fileName: String!
  url: String!
  s3Key: String!
  type: String
}

enum FileStatus {
  UPLOADED
  PROCESSING
  PROCESSED
  FAILED
}

enum ApprovalStatus {
  PENDING
  APPROVED
  REJECTED
}